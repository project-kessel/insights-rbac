name: Pull request conflict status

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: pr-conflict-status
  cancel-in-progress: true

jobs:
  update-conflict-status:
    runs-on: ubuntu-latest
    steps:
      - name: Update conflict label and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const labelName = 'needs-rebase';
            const commentMarker = '<!-- pr-conflict-status -->';
            const commentBody = (pr, isConflicted) => isConflicted
              ? `${commentMarker}\n⚠️ **This PR has merge conflicts with ${pr.base.ref}.**\n\nPlease rebase this branch onto ${pr.base.ref} and push the updated branch. This reminder will update when the conflict is resolved.`
              : `${commentMarker}\n✅ **This PR no longer has merge conflicts with ${pr.base.ref}.**`;

            const label = {
              name: labelName,
              color: 'D93F0B',
              description: 'Pull request has merge conflicts and needs a rebase',
            };

            // Ensure the label exists so the workflow works in repositories that have not
            // created it manually. A concurrent run may create it first.
            try {
              await github.rest.issues.createLabel({ owner, repo, ...label });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            let pullRequests;
            if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              pullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
            } else {
              pullRequests = [context.payload.pull_request];
            }

            for (const initialPr of pullRequests) {
              const pull_number = initialPr.number;
              let pr = initialPr;

              // GitHub computes mergeability asynchronously after PR updates.
              if (pr.state === 'open') {
                for (let attempt = 0; pr.mergeable === null && attempt < 6; attempt++) {
                  await new Promise(resolve => setTimeout(resolve, 3000));
                  ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number }));
                }
              }

              if (pr.state === 'open' && pr.mergeable === null) {
                core.warning(`Mergeability is still being calculated for PR #${pull_number}; leaving its current status unchanged.`);
                continue;
              }

              const isConflicted = pr.state === 'open' && pr.mergeable === false;
              const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const hasLabel = labels.some(existing => existing.name === labelName);

              if (isConflicted && !hasLabel) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [labelName] });
              } else if (!isConflicted && hasLabel) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: labelName });
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });
              const statusComment = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(commentMarker),
              );

              if (statusComment) {
                const body = commentBody(pr, isConflicted);
                if (statusComment.body !== body) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: statusComment.id, body });
                }
              } else if (isConflicted) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull_number,
                  body: commentBody(pr, true),
                });
              }

              core.info(`PR #${pull_number}: ${isConflicted ? 'needs rebase' : 'conflict-free or closed'}`);
            }
