name: Pull request branch status

on:
  schedule:
    - cron: "17,47 9-16 * * 1-5"
      timezone: "Europe/Prague"
    - cron: "17,47 9-16 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-branch-status
  cancel-in-progress: false

jobs:
  update-branch-status:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile branch status labels and comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const conflictLabelName = 'needs-rebase';
            const updateLabelName = 'needs-update';
            const conflictCommentMarker = '<!-- pr-conflict-status:conflict -->';
            const resolvedCommentMarker = '<!-- pr-conflict-status:resolved -->';
            const outOfDateCommentMarker = '<!-- pr-conflict-status:out-of-date -->';
            const upToDateCommentMarker = '<!-- pr-conflict-status:up-to-date -->';
            const conflictComment = [
              conflictCommentMarker,
              '⚠️ **This PR has merge conflicts with its base branch.**',
              '',
              'Please rebase onto the base branch, resolve the conflicts, and push the updated branch.',
            ].join('\n');
            const resolvedComment = `${resolvedCommentMarker}\n✅ **The merge conflicts on this PR are resolved.**`;
            const outOfDateComment = [
              outOfDateCommentMarker,
              '⚠️ **This PR is behind its base branch.**',
              '',
              'Use GitHub’s **Update branch** button, or merge/rebase the latest base branch and push the update.',
            ].join('\n');
            const upToDateComment = `${upToDateCommentMarker}\n✅ **This PR is up to date with its base branch.**`;

            const verifiedLabels = new Set();
            async function ensureLabel(name, color, description) {
              if (verifiedLabels.has(name)) return;

              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;

                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  // Confirm the label exists in case it was created after the lookup.
                  await github.rest.issues.getLabel({ owner, repo, name });
                }
              }

              verifiedLabels.add(name);
            }

            function latestCommentWithMarkers(comments, markers) {
              return comments
                .filter(comment => markers.some(marker => comment.body?.startsWith(marker)))
                .reduce((latest, comment) =>
                  !latest || Date.parse(comment.created_at) > Date.parse(latest.created_at) ? comment : latest,
                null);
            }

            async function reconcile(pull_number) {
              // The list response omits mergeable. GitHub may initially return null
              // from the detail endpoint while it calculates the result.
              const params = { owner, repo, pull_number };
              let { data: pr } = await github.rest.pulls.get(params);
              for (let retry = 0; retry < 3 && pr.state === 'open' && typeof pr.mergeable !== 'boolean'; retry++) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                ({ data: pr } = await github.rest.pulls.get(params));
              }

              if (pr.state !== 'open') return;
              if (typeof pr.mergeable !== 'boolean') {
                core.warning(`Mergeability is still unknown for PR #${pull_number}.`);
                return;
              }

              const issue = { owner, repo, issue_number: pull_number };
              const isConflicted = pr.mergeable === false;
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: pr.base.sha,
                head: pr.head.sha,
              });
              const isOutOfDate = comparison.data.behind_by > 0;
              const hasConflictLabel = pr.labels.some(label => label.name === conflictLabelName);
              const hasUpdateLabel = pr.labels.some(label => label.name === updateLabelName);

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...issue,
                per_page: 100,
              });
              const statusComments = comments.filter(comment =>
                comment.user?.login === 'github-actions[bot]' && (
                  comment.body?.startsWith(conflictCommentMarker) ||
                  comment.body?.startsWith(resolvedCommentMarker) ||
                  comment.body?.startsWith(outOfDateCommentMarker) ||
                  comment.body?.startsWith(upToDateCommentMarker)
                ),
              );
              const lastConflictComment = latestCommentWithMarkers(statusComments, [
                conflictCommentMarker,
                resolvedCommentMarker,
              ]);
              const lastUpdateComment = latestCommentWithMarkers(statusComments, [
                outOfDateCommentMarker,
                upToDateCommentMarker,
              ]);
              const lastStatusWasConflicted = lastConflictComment?.body?.startsWith(conflictCommentMarker);
              const lastStatusWasResolved = lastConflictComment?.body?.startsWith(resolvedCommentMarker);
              const lastStatusWasOutOfDate = lastUpdateComment?.body?.startsWith(outOfDateCommentMarker);
              const lastStatusWasUpToDate = lastUpdateComment?.body?.startsWith(upToDateCommentMarker);

              if (isConflicted && !hasConflictLabel) {
                await ensureLabel(
                  conflictLabelName,
                  'D93F0B',
                  'Pull request has merge conflicts and needs a rebase',
                );
                await github.rest.issues.addLabels({ ...issue, labels: [conflictLabelName] });
              }
              if (isOutOfDate && !hasUpdateLabel) {
                await ensureLabel(
                  updateLabelName,
                  'FBCA04',
                  'Pull request branch is behind its base branch',
                );
                await github.rest.issues.addLabels({ ...issue, labels: [updateLabelName] });
              }

              const shouldPostConflictComment = isConflicted
                ? !lastStatusWasConflicted
                : (hasConflictLabel || lastStatusWasConflicted) && !lastStatusWasResolved;

              if (shouldPostConflictComment) {
                await github.rest.issues.createComment({
                  ...issue,
                  body: isConflicted ? conflictComment : resolvedComment,
                });
              }

              const shouldPostUpdateComment = isOutOfDate
                ? !lastStatusWasOutOfDate
                : (hasUpdateLabel || lastStatusWasOutOfDate) && !lastStatusWasUpToDate;

              if (shouldPostUpdateComment) {
                await github.rest.issues.createComment({
                  ...issue,
                  body: isOutOfDate ? outOfDateComment : upToDateComment,
                });
              }

              // Keep labels as retry signals until the resolution comments are posted.
              if (!isConflicted && hasConflictLabel) {
                await github.rest.issues.removeLabel({ ...issue, name: conflictLabelName });
              }
              if (!isOutOfDate && hasUpdateLabel) {
                await github.rest.issues.removeLabel({ ...issue, name: updateLabelName });
              }
            }

            const pullRequests = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            for (const { number } of pullRequests) {
              try {
                await reconcile(number);
              } catch (error) {
                core.setFailed(`PR #${number}: ${error.message}`);
              }
            }
