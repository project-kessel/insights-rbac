name: Git Checks

on:
  pull_request:

jobs:
  message-check:
    name: Block Autosquash Commits

    runs-on: ubuntu-latest

    steps:
      - name: Block Autosquash Commits
        uses: skjnldsv/block-fixup-merge-action@c138ea99e45e186567b64cf065ce90f7158c236a # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
