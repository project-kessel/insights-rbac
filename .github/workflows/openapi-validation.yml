name: openapi-validate
on:
  push:
    branches:
      - master
    paths:
      - 'docs/source/specs/openapi.json'
      - 'docs/source/specs/v2/openapi.yaml'
      - 'docs/source/specs/v2/openapi.json'
      - '.redocly.yaml'
  # Keep this unfiltered: `openapi-validate` is a required branch protection check.
  # The job below skips validation for unrelated PR changes while still reporting a result.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            openapi:
              - 'docs/source/specs/openapi.json'
              - 'docs/source/specs/v2/openapi.yaml'
              - 'docs/source/specs/v2/openapi.json'
              - '.redocly.yaml'

  openapi-validate:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.openapi == 'true' ||
       needs.changes.result != 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Validate OpenAPI specs
        run: |
          npx --yes @redocly/cli lint --config .redocly.yaml \
            docs/source/specs/openapi.json \
            docs/source/specs/v2/openapi.yaml \
            docs/source/specs/v2/openapi.json
