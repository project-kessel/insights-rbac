name: typespec-openapi-drift

on:
  # Keep this unfiltered: `check-spec-drift` is a required branch protection check.
  # The job below skips validation for unrelated PR changes while still reporting a result.
  pull_request:
  merge_group:
  push:
    branches: [master]
    paths:
      - 'docs/source/specs/typespec/main.tsp'
      - 'docs/source/specs/typespec/tspconfig.yaml'
      - 'docs/source/specs/typespec/package.json'
      - 'docs/source/specs/v2/openapi.json'
      - 'docs/source/specs/v2/openapi.yaml'

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      specs: ${{ steps.filter.outputs.specs }}
    steps:
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            specs:
              - 'docs/source/specs/typespec/main.tsp'
              - 'docs/source/specs/typespec/tspconfig.yaml'
              - 'docs/source/specs/typespec/package.json'
              - 'docs/source/specs/v2/openapi.json'
              - 'docs/source/specs/v2/openapi.yaml'

  check-spec-drift:
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.specs == 'true' ||
       needs.changes.result != 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/source/specs/typespec
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install TypeSpec dependencies
        run: npm ci

      - name: Regenerate OpenAPI specs
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          ./compile_tsp_spec

      - name: Check for drift
        working-directory: .
        run: |
          if ! git diff --exit-code docs/source/specs/v2/; then
            echo ""
            echo "::error::OpenAPI specs are out of date with main.tsp. Run 'make generate_v2_spec' and commit the result."
            exit 1
          fi
          echo "OpenAPI specs are in sync with TypeSpec."
