# RBAC-only local stack: Postgres + Redis + Kafka + Debezium + mock Kessel + API + consumer.
#
# For real Kessel + Debezium + RBAC + Host Inventory, use the full integration stack:
#   make docker-local-full-up rbac=local rbac-config=upstream
#
# Start this RBAC-only stack:
#   make docker-local-up
#   # or: docker compose -f docker-compose.local.yml up --build -d
#
# Endpoints:
#   RBAC API:     http://localhost:9080
#   PostgreSQL:   localhost:15432
#   Kafdrop:      http://localhost:9001
#   Kafka Connect http://localhost:8083
#   Mock Kessel:  localhost:50051 (gRPC)
#
# Create a workspace (after stack is healthy):
#   ./scripts/validations/api/create-workspace.sh --no-start --count 1
#   # use API_URL=http://localhost:9080; stack uses mock Kessel by default
#
# Real stage Kessel instead of mock (requires port-forward on host :9000):
#   RELATION_API_SERVER=host.docker.internal:9000 \
#   INVENTORY_API_SERVER=host.docker.internal:9000 \
#   docker compose -f docker-compose.local.yml up --build -d --scale mock-kessel=0

x-rbac-build: &rbac-build
  context: .
  dockerfile: Dockerfile

x-rbac-env: &rbac-env
  DEVELOPMENT: "True"
  DJANGO_DEBUG: "True"
  DJANGO_LOG_HANDLERS: console
  DJANGO_LOG_FILE: /tmp/rbac_local.log
  DJANGO_READ_DOT_ENV_FILE: "True"
  DATABASE_SERVICE_NAME: POSTGRES_SQL
  DATABASE_ENGINE: postgresql
  DATABASE_NAME: postgres
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  POSTGRES_SQL_SERVICE_HOST: db
  POSTGRES_SQL_SERVICE_PORT: "5432"
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  REDIS_HOST: redis
  API_PATH_PREFIX: /api/rbac
  BYPASS_BOP_VERIFICATION: "True"
  PRINCIPAL_USER_DOMAIN: redhat
  REPLICATION_TO_RELATION_ENABLED: "true"
  READ_YOUR_WRITES_WORKSPACE_ENABLED: "True"
  READ_YOUR_WRITES_TIMEOUT_SECONDS: "30"
  V2_APIS_ENABLED: "True"
  V2_READ_ONLY_API_MODE: "False"
  V2_BOOTSTRAP_TENANT: "True"
  WORKSPACE_HIERARCHY_DEPTH_LIMIT: "5"
  WORKSPACE_ORG_CREATION_LIMIT: "3000"
  KAFKA_ENABLED: "false"
  RBAC_KAFKA_CONSUMER_TOPIC: outbox.event.relations-replication-event
  RBAC_KAFKA_CONSUMER_GROUP_ID: rbac-consumer-group-local
  RBAC_KAFKA_CUSTOM_CONSUMER_BROKER: kafka:9092
  RELATION_API_SERVER: ${RELATION_API_SERVER:-mock-kessel:50051}
  INVENTORY_API_SERVER: ${INVENTORY_API_SERVER:-mock-kessel:50051}
  RELATIONS_API_CLIENT_ID: ${RELATIONS_API_CLIENT_ID:-}
  RELATIONS_API_CLIENT_SECRET: ${RELATIONS_API_CLIENT_SECRET:-}
  INVENTORY_API_CLIENT_ID: ${INVENTORY_API_CLIENT_ID:-}
  INVENTORY_API_CLIENT_SECRET: ${INVENTORY_API_CLIENT_SECRET:-}
  SYSTEM_DEFAULT_ROOT_WORKSPACE_ROLE_UUID: e31b93d4-8570-4cfe-a79f-8421560e1487
  SYSTEM_DEFAULT_TENANT_ROLE_UUID: 1607fbde-7781-436e-8860-ef73b83c9aa1
  SYSTEM_ADMIN_ROOT_WORKSPACE_ROLE_UUID: 2c2d2bb1-24dc-42ca-b739-7c59ecd4a9ab
  SYSTEM_ADMIN_TENANT_ROLE_UUID: 51b5fd3b-9733-46e8-bbe2-f77f99871d49

services:
  db:
    container_name: rbac_local_db
    image: postgres:16
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      - rbac_local_pg_data:/var/lib/postgresql/data
      - ./scripts/local_stack/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    container_name: rbac_local_redis
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 5

  zookeeper:
    container_name: rbac_local_zookeeper
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    container_name: rbac_local_kafka
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 8

  kafka-connect:
    container_name: rbac_local_kafka_connect
    image: quay.io/debezium/connect:3.2.2.Final
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

  kafdrop:
    container_name: rbac_local_kafdrop
    image: obsidiandynamics/kafdrop:3.30.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms16M -Xmx48M -Xss180K -XX:-TieredCompilation -XX:+UseStringDeduplication -noverify"

  mock-kessel:
    container_name: rbac_local_mock_kessel
    build: *rbac-build
    working_dir: /opt/rbac
    entrypoint: ["python", "scripts/local_ryw_test/mock_kessel_server.py", "50051"]
    ports:
      - "127.0.0.1:50051:50051"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',50051),2); s.close()\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rbac-migrate:
    container_name: rbac_local_migrate
    build: *rbac-build
    environment:
      <<: *rbac-env
    entrypoint: ["/bin/sh", "/opt/rbac/scripts/local_stack/run-migrations.sh"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  kafka-init:
    container_name: rbac_local_kafka_init
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create \
          --topic outbox.event.relations-replication-event \
          --partitions 1 --replication-factor 1 2>/dev/null || true
        echo "Kafka topic ready"
    restart: "no"

  debezium-init:
    container_name: rbac_local_debezium_init
    image: curlimages/curl:8.5.0
    volumes:
      - ./scripts/local_stack/debezium-connector.json:/connector/debezium-connector.json:ro
      - ./scripts/local_stack/register-debezium-connector.sh:/register.sh:ro
    entrypoint: ["/bin/sh", "/register.sh"]
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      CONNECTOR_JSON: /connector/debezium-connector.json
    depends_on:
      kafka-connect:
        condition: service_started
      rbac-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: "no"

  rbac-server:
    container_name: rbac_local_server
    build: *rbac-build
    working_dir: /rbac
    entrypoint: ["./scripts/entrypoint.sh"]
    ports:
      - "127.0.0.1:9080:8080"
    environment:
      <<: *rbac-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/rbac/
    depends_on:
      rbac-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-kessel:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/metrics')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  rbac-kafka-consumer:
    container_name: rbac_local_kafka_consumer
    build: *rbac-build
    working_dir: /opt/rbac/rbac
    entrypoint: ["python", "manage.py", "launch-rbac-kafka-consumer", "relations"]
    environment:
      <<: *rbac-env
      KAFKA_ENABLED: "True"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rbac-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
      mock-kessel:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rbac_local_pg_data:
