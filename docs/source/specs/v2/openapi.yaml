  /permissions/:
    get:
      operationId: Permissions_list
      summary: List the permissions for a tenant
      description: List the permissions for a tenant
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/Limit'
            default: 10
          explode: false
        - name: offset
          in: query
          required: false
          description: Offset for offset-based pagination.
          schema:
            allOf:
              - $ref: '#/components/schemas/Offset'
            default: 0
          explode: false
        - name: application
          in: query
          required: false
          description: Filter by application name. Exact match by default. You may also use a comma-separated list to match on multiple applications.
          schema:
            type: string
          explode: false
        - name: resource_type
          in: query
          required: false
          description: Filter permissions by the resource type (e.g. 'tenant', 'workspace'). When omitted, returns permissions from all types. You may also use a comma-separated list to match on multiple resource_types.
          schema:
            type: string
          explode: false
        - name: operation
          in: query
          required: false
          description: Filter by operation (e.g. 'read', 'create', 'delete', 'update'). You may also use a comma-separated list to match on multiple operation types. Equivalent to `verb` in the v1 API.
          schema:
            type: string
          explode: false
        - name: permission
          in: query
          required: false
          description: Filter by full permission string. Partial/contains match (e.g. 'workspace' matches 'rbac:workspace:read'), Only a single value is supported.
          schema:
            type: string
          explode: false
        - name: exclude_globals
          in: query
          required: false
          description: When true, exclude wildcard/global permissions (where application, resource_type, or operation is '*') from the results.
          schema:
            type: boolean
            default: false
          explode: false
        - name: exclude_roles
          in: query
