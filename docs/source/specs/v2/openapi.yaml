openapi: 3.0.0
info:
  title: Role Based Access Control for Kessel Project
  version: v2
tags:
  - name: Workspaces
  - name: Role Bindings
  - name: Roles
  - name: Audit Logs
  - name: Principals
  - name: Permissions
  - name: Groups
paths:
  /auditlogs/:
    get:
      operationId: AuditLogs_list
      summary: List the audit log entries for a tenant
      description: List the audit log entries for a tenant
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/Limit'
            default: 10
          explode: false
        - name: cursor
          in: query
          required: false
          description: Cursor for cursor-based pagination.
          schema:
            $ref: '#/components/schemas/Cursor'
          explode: false
        - name: principal_username
          in: query
          required: false
          description: Filter by principal username. Case-insensitive substring match by default; use * for glob patterns (e.g. jd*).
          schema:
            type: string
          explode: false
        - name: resource_type
          in: query
          required: false
          description: Filter by the type of resource the action was performed on.
          schema:
            $ref: '#/components/schemas/AuditLogResourceType'
          explode: false
        - name: resource_id
          in: query
          required: false
          description: Filter by the UUID of the resource the action was performed on.
          schema:
            $ref: '#/components/schemas/UUID'
          explode: false
        - name: action
          in: query
          required: false
          description: Filter by the action that was performed.
          schema:
            $ref: '#/components/schemas/AuditLogAction'
          explode: false
        - name: created_after
          in: query
          required: false
          description: Only return entries created at or after this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
          explode: false
        - name: created_before
          in: query
          required: false
          description: Only return entries created at or before this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
          explode: false
        - name: fields
          in: query
          required: false
          description: Control which fields are included in the response to optimize payload size.
          schema:
            allOf:
              - $ref: '#/components/schemas/FieldMask'
            default: created,principal_username,description,resource_type,resource_id,action,source
          explode: false
        - name: order_by
          in: query
          required: false
          description: "Sort by specified field, prefix with '-' for descending order. Allowed fields: created."
          schema:
            allOf:
              - $ref: '#/components/schemas/OrderBy'
            default: -created
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - meta
                  - links
                  - data
                properties:
                  meta:
                    $ref: '#/components/schemas/CursorPaginationMeta'
                  links:
                    $ref: '#/components/schemas/CursorPaginationLinks'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
              example:
                meta:
                  limit: 10
                links:
                  next: /api/rbac/v2/auditlogs/?limit=10&cursor=eyJwIjoiMjAyNC0wOC0wNFQxMjowMDowMFoifQ%3D%3D
                  previous: null
                data:
                  - created: '2024-08-04T12:00:00Z'
                    principal_username: jdoe
                    description: 'Created workspace: Alpha Workspace'
                    resource_type: workspace
                    resource_id: e4277742-b91c-43f1-a185-b827e8574345
                    action: create
                    source: null
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Audit Logs
  /groups/:
    get:
      operationId: Groups_list
      summary: List groups
      description: List groups. Supports filtering by name, role membership, principal membership, and group flags. Use scope=principal to return only groups the calling user belongs to.
      parameters:
        - name: name
          in: query
          required: false
          description: Filter by name (substring or glob with *)
          schema:
            type: string
          explode: false
        - name: uuid
          in: query
          required: false
          description: Filter by group UUIDs
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UUID'
          explode: false
        - name: username
          in: query
          required: false
          description: Filter groups that contain this username as a member. Matches user principals only, not service accounts.
          schema:
            type: string
            maxLength: 150
          explode: false
        - name: exclude_username
          in: query
          required: false
          description: Exclude groups that contain this username. Matches user principals only, not service accounts. Mutually exclusive with username.
          schema:
            type: string
            maxLength: 150
          explode: false
        - name: role_names
          in: query
          required: false
          description: Filter groups by comma-separated role names (maximum 50). Use role_discriminator to control match logic.
          schema:
            type: string
            maxLength: 2000
          explode: false
        - name: role_discriminator
          in: query
          required: false
          description: "Controls how role_names are matched: 'any' returns groups with at least one matching role; 'all' requires every role. Only used with role_names."
          schema:
            allOf:
              - $ref: '#/components/schemas/RoleDiscriminator'
            default: any
          explode: false
        - name: principals
          in: query
          required: false
          description: Filter groups by comma-separated principal usernames (maximum 50). Returns groups that contain ALL specified principals. Matches user principals only, not service accounts.
          schema:
            type: string
            maxLength: 2000
          explode: false
        - name: scope
          in: query
          required: false
          description: "Scope filter: 'org_id' (default) returns all groups in the organization; 'principal' returns only groups the calling user belongs to. Matches user principals only, not service accounts."
          schema:
            allOf:
              - $ref: '#/components/schemas/GroupScope'
            default: org_id
          explode: false
        - name: system
          in: query
          required: false
          description: Filter by system group flag
          schema:
            type: boolean
          explode: false
        - name: platform_default
          in: query
          required: false
          description: Filter by platform default group flag
          schema:
            type: boolean
          explode: false
        - name: admin_default
          in: query
          required: false
          description: Filter by admin default group flag
          schema:
            type: boolean
          explode: false
        - name: order_by
          in: query
          required: false
          description: 'Order by field (prefix - for descending). Allowed: name, modified, principal_count, role_count'
          schema:
            type: string
            default: name
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/Limit'
            default: 10
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/Offset'
            default: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups.GroupListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
    post:
      operationId: Groups_create
      summary: Create a group
      description: Create a group
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups.Group'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Problems.Problem400'
                  - $ref: '#/components/schemas/Problems.Problem400AlreadyExists'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Groups.GroupInput'
  /groups/{uuid}/:
    get:
      operationId: Groups_retrieve
      summary: Retrieve a group
      description: Retrieve a group by UUID. Unlike V1, V2 does not embed principals or roles in the group response. Use GET /groups/{uuid}/principals/ for membership and GET /role-bindings/by-subject/?subject_type=group&subject_id={uuid} for role assignments. This is an intentional contract change to reduce payload size and support pagination on related resources.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups.Group'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem404'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
    put:
      operationId: Groups_update
      summary: Update a group
      description: 'Update a group. Protected-group behavior: system groups (system=true) return 400; platform_default and admin_default groups allow name/description updates but not membership changes through this endpoint.'
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups.Group'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem404'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Groups.GroupInput'
    delete:
      operationId: Groups_destroy
      summary: Delete a group
      description: 'Delete a group. Protected-group behavior: system groups (system=true) return 400; platform_default groups return 400; admin_default groups return 400. Groups with active role bindings return 409 Conflict. Only custom (non-protected) groups with no active role bindings can be deleted.'
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem404'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem409'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
  /groups/{uuid}/principals/:
    get:
      operationId: Groups_listPrincipals
      summary: List group principals
      description: List principals who are members of this group. When principal_type is omitted it defaults to 'user', so the response contains only user principals. Set principal_type=all to get a unified Principal[] containing both users and service accounts, with the type field distinguishing them.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: principal_type
          in: query
          required: false
          description: "Filter by principal type: 'user' (default), 'service-account', or 'all'. When 'all', returns both users and service accounts in a unified list."
          schema:
            allOf:
              - $ref: '#/components/schemas/PrincipalTypeFilter'
            default: user
          explode: false
        - name: username
          in: query
          required: false
          description: Filter by username (substring match). Applies to user principals.
          schema:
            type: string
          explode: false
        - name: principal_username
          in: query
          required: false
          description: Filter by principal username (case-insensitive substring match). Applies to both user and service-account principals.
          schema:
            type: string
          explode: false
        - name: username_only
          in: query
          required: false
          description: Accepted for API compatibility. This endpoint does not enrich user principals from external identity services, so this flag has no effect.
          schema:
            type: boolean
            default: false
          explode: false
        - name: admin_only
          in: query
          required: false
          description: "When true, return only org admin users. Applies to user principals only. Not yet implemented: org-admin status requires a BOP/IT lookup not available to this endpoint's local-only lookups; the flag is currently accepted but has no filtering effect."
          schema:
            type: boolean
            default: false
          explode: false
        - name: service_account_name
          in: query
          required: false
          description: Filter service accounts by display name (substring match). Only used when principal_type is 'service-account' or 'all'.
          schema:
            type: string
          explode: false
        - name: service_account_description
          in: query
          required: false
          description: Filter service accounts by description (substring match). Only used when principal_type is 'service-account' or 'all'.
          schema:
            type: string
          explode: false
        - name: service_account_client_ids
          in: query
          required: false
          description: Check membership of specific service account client IDs (comma-separated). Incompatible with other filter parameters. Returns only the matching service accounts that are members of this group.
          schema:
            type: string
          explode: false
        - name: limit
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/Limit'
            default: 10
          explode: false
        - name: offset
          in: query
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/Offset'
            default: 0
          explode: false
        - name: order_by
          in: query
          required: false
          schema:
            type: string
            default: username
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups.PrincipalListResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem404'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
    post:
      operationId: Groups_addPrincipals
      summary: Add principals to a group
      description: 'Add principals to a group. At least one of usernames or service_accounts must contain items. Protected-group behavior: system groups return 400; platform_default and admin_default groups allow adding members.'
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups.Group'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem404'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Groups.AddPrincipalsInput'
    delete:
      operationId: Groups_removePrincipals
      summary: Remove principals from a group in bulk
      description: "Remove principals from a group in bulk. At least one of usernames or service_accounts must be provided. Note: V1 spelled this query parameter 'service-accounts'; V2 uses snake_case 'service_accounts' for consistency with the rest of the V2 contract. All specified principals must be members of the group; if any are not found, the request returns 404 and no removals are performed. Protected-group behavior: system groups return 400."
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
        - name: usernames
          in: query
          required: false
          description: Comma-separated usernames to remove from the group. At most 100 unique identifiers after deduplication.
          schema:
            type: string
          explode: false
        - name: service_accounts
          in: query
          required: false
          description: Comma-separated service account client IDs to remove from the group. At most 100 unique identifiers after deduplication.
          schema:
            type: string
          explode: false
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem400'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem401'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem403'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem404'
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problems.Problem500'
      tags:
        - Groups
  /groups/{uuid}/principals/{principal_uuid}/:
    delete:
      operationId: Groups_removePrincipal
      summary: Remove a principal from a group
      description: 'Remove a single principal from a group by principal UUID. Protected-group behavior: system groups return 400. For bulk removal, use DELETE /groups/{uuid}/principals/ with query parameters.'
      parameters:
