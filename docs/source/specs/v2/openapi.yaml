components:
  schemas:
    AuditLog:
      type: object
      properties:
        created:
          type: string
          format: date-time
          description: Timestamp of when the audited action occurred
        principal_username:
          type: string
          description: Username of the principal that performed the action
        description:
          type: string
          description: Human readable description of the audited action
        resource_type:
          allOf:
            - $ref: '#/components/schemas/AuditLogResourceType'
          description: Type of resource the action was performed on
        resource_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/UUID'
          nullable: true
          description: UUID of the resource the action was performed on. Null for entries recorded before UUIDs were captured, or for resource types without a UUID.
        action:
          allOf:
            - $ref: '#/components/schemas/AuditLogAction'
          description: Action that was performed
        source:
          allOf:
            - $ref: '#/components/schemas/AuditLogSource'
          nullable: true
          description: Origin of the request. Null for ordinary API requests.
      example:
        created: '2024-08-04T12:00:00Z'
        principal_username: jdoe
        description: 'Created workspace: Alpha Workspace'
        resource_type: workspace
        resource_id: e4277742-b91c-43f1-a185-b827e8574345
        action: create
        source: null
    AuditLogAction:
      type: string
      enum:
        - delete
        - add
        - edit
        - create
        - remove
        - read
      description: Action recorded by an audit log entry
    AuditLogResourceType:
      type: string
      enum:
        - group
        - group_v2
        - role
        - role_v2
        - user
        - permission
        - workspace
        - role_binding
      description: Type of resource an audit log entry refers to
    AuditLogSource:
      type: string
      enum:
        - ai_assistant
      description: Origin of the request that produced the audit log entry. Null for ordinary API requests.
    Cursor:
      type: string
      description: |-
        Cursor for cursor-based pagination.
        An opaque string that points to the next/previous page of results.
    CursorPaginationLinks:
      type: object
      required:
        - next
        - previous
      properties:
        next:
          type: string
          nullable: true
          format: uri
          description: The next link in pagination
          example: /api/rbac/v2/(resource)/?limit=10&cursor=eyJpZCI6IjEyMyJ9
        previous:
          type: string
          nullable: true
          format: uri
          description: The previous link in pagination
          example: /api/rbac/v2/(resource)/?limit=10&cursor=eyJpZCI6IjEwMCJ9
    CursorPaginationMeta:
      type: object
      required:
        - limit
      properties:
        limit:
          allOf:
            - $ref: '#/components/schemas/Limit'
          description: Limit of returned objects. Use -1 to return all objects.
          example: 10
          default: 10
    ExcludeSources:
      type: string
      enum:
        - direct
        - indirect
        - none
      description: "Exclude bindings by source type: 'none' (default) shows all, 'indirect' excludes inherited, 'direct' excludes direct"
    FieldMask:
      type: string
      description: |-
        Field mask used by the `fields` query parameter to control which fields
        are included in the response.

        **Syntax:**
        - Use comma to separate multiple fields: `id,name,description`
        - Use parentheses for nested objects: `subject(id,name),resource(type)`

        **Examples:**
        - `id,name`
        - `subject(group.name),role(name)`
    GroupScope:
      type: string
      enum:
        - org_id
        - principal
      description: Group scope filter for controlling group visibility
    Groups.AddPrincipalsInput:
      anyOf:
        - $ref: '#/components/schemas/Groups.AddUsernamesInput'
        - $ref: '#/components/schemas/Groups.AddServiceAccountsInput'
      description: Principals to add to a group. At least one of usernames or service_accounts must be present and non-empty; an empty object is rejected.
    Groups.AddServiceAccountsInput:
      type: object
      required:
        - service_accounts
      properties:
        usernames:
          type: array
          items:
            type: string
          minItems: 1
          description: Usernames to add. At most 100 unique identifiers are allowed after deduplication.
        service_accounts:
          type: array
          items:
            type: string
          minItems: 1
          description: Service account client IDs to add. Must contain at least one item. At most 100 unique identifiers are allowed after deduplication.
          example:
            - abc-123-def
      description: Add principals by service account client ID. usernames may also be supplied.
    Groups.AddUsernamesInput:
      type: object
      required:
        - usernames
      properties:
        usernames:
          type: array
          items:
            type: string
          minItems: 1
          description: Usernames to add. Must contain at least one item. At most 100 unique identifiers are allowed after deduplication.
        service_accounts:
          type: array
          items:
            type: string
          minItems: 1
          description: Service account client IDs to add. At most 100 unique identifiers are allowed after deduplication.
          example:
            - abc-123-def
      description: Add principals by username. service_accounts may also be supplied.
    Groups.Group:
      type: object
      required:
        - uuid
        - name
        - principal_count
        - role_count
        - created
        - modified
        - system
        - platform_default
        - admin_default
      properties:
        uuid:
          allOf:
            - $ref: '#/components/schemas/UUID'
          description: UUID that uniquely identifies the group
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Name of the group
        description:
          type: string
          maxLength: 1000
          description: Description of the group
        principal_count:
          type: integer
          format: int64
          minimum: 0
          description: Number of user principals in the group (does not count service accounts, matching V1 principalCount semantics)
        role_count:
          type: integer
          format: int32
          minimum: 0
          description: Number of roles assigned to this group via role bindings
        created:
          type: string
          format: date-time
          description: '2019-01-21T17:32:28Z'
        modified:
          type: string
          format: date-time
          description: '2019-01-21T17:32:28Z'
        system:
          type: boolean
          description: Whether this is a system-managed group
        platform_default:
          type: boolean
          description: Whether this is the platform default group
        admin_default:
          type: boolean
          description: Whether this is the admin default group
    Groups.GroupInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          description: Name of the group
        description:
          type: string
          maxLength: 1000
          description: Description of the group
    Groups.GroupListResponse:
      type: object
      required:
        - meta
        - links
        - data
      properties:
        meta:
          $ref: '#/components/schemas/OffsetPaginationMeta'
        links:
          $ref: '#/components/schemas/OffsetPaginationLinks'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Groups.Group'
    Groups.PrincipalListResponse:
      type: object
      required:
        - meta
        - links
        - data
      properties:
        meta:
          $ref: '#/components/schemas/OffsetPaginationMeta'
        links:
          $ref: '#/components/schemas/OffsetPaginationLinks'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Principal'
    Limit:
      type: integer
      format: int64
      description: |-
        Limit for pagination. Controls the maximum number of items returned.
        Default: 10. Use -1 to return all objects in a single response.

        Maximum values (enforced server-side, not in schema):
        - Workspaces: 3000
        - All other list endpoints: 1000
    Offset:
      type: integer
      format: int64
      description: |-
        Offset for offset-based pagination.
        The number of items to skip before starting to return results.
    OffsetPaginationLinks:
      type: object
      required:
        - first
        - next
        - previous
        - last
      properties:
        first:
          type: string
          nullable: true
          format: uri
          description: The first link in pagination
          example: /api/rbac/v2/workspaces/?limit=10&offset=0
        next:
          type: string
          nullable: true
          format: uri
          description: The next link in pagination
          example: /api/rbac/v2/workspaces/?limit=10&offset=10
        previous:
          type: string
          nullable: true
          format: uri
          description: The previous link in pagination
          example: /api/rbac/v2/workspaces/?limit=10&offset=0
        last:
          type: string
          nullable: true
          format: uri
          description: The last link in pagination
          example: /api/rbac/v2/workspaces/?limit=10&offset=90
    OffsetPaginationMeta:
      type: object
      required:
        - count
        - limit
        - offset
      properties:
        count:
          type: integer
          format: int64
          description: Total count of objects
          example: 10
        limit:
          allOf:
            - $ref: '#/components/schemas/Limit'
          description: Limit of returned objects. Use -1 to return all objects.
          example: 10
          default: 10
        offset:
          allOf:
            - $ref: '#/components/schemas/Offset'
          description: Offset of returned objects
          example: 0
          default: 0
    OrderBy:
      type: string
      description: |-
        Sort order specification for list operations.
        Use comma to separate multiple fields, prefix with '-' for descending order.

        **Examples:**
        - `name` - Sort by name ascending
        - `-last_modified` - Sort by last_modified descending
        - `name,-created` - Sort by name ascending, then created descending
    Permission:
      type: object
      properties:
        application:
          type: string
        resource_type:
          type: string
        operation:
          type: string
          description: The action allowed by this permission (e.g. 'read', 'create', 'delete', 'update'). Equivalent to `verb` in the v1 API.
        permission:
          type: string
          description: The full permission string, e.g. 'rbac:workspace:read'.
        description:
          type: string
          description: A description of what this permission grants access to.
        requires:
          type: array
          items:
            type: string
          description: List of other permission strings that are required alongside this one.
      example:
        application: rbac
        resource_type: workspace
        operation: read
        permission: rbac:workspace:read
        description: Read access to workspaces
        requires: []
    PermissionWrite:
      type: object
      required:
        - application
        - resource_type
        - operation
      properties:
        application:
          type: string
        resource_type:
          type: string
        operation:
          type: string
          description: The action allowed by this permission (e.g. 'read', 'create', 'delete', 'update'). Equivalent to `verb` in the v1 API.
      description: Permission data for role create and update operations. Unlike `Permission`, all fields are required.
      example:
        application: rbac
        resource_type: workspace
        operation: read
